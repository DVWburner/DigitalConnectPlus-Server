# Nginx Reverse-Proxy Configuration for Digital Connect+ Server
# Gen5W Android 4.4.2 KitKat (Conscrypt) + Android/iOS TLS 1.2 & TLS 1.3 Compatible
# Replace <YOUR_DOMAIN> with the domain you purchased!

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <YOUR_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;

    # CRITICAL Rule 1: Must enable BOTH TLSv1.2 (for Android 4.4.2 head unit) and TLSv1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    # CRITICAL Rule 2: Must include prime256v1 (P-256) and secp384r1 (KitKat does NOT support X25519-only!)
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # CRITICAL Rule 3: Mozilla Intermediate TLS 1.2 cipher suites supported by Android 4.4.2 Conscrypt
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-CBC-SHA;
    ssl_prefer_server_ciphers off;

    # Match client MAX_HTTP_BYTES = 262144 (256 KB)
    client_max_body_size 256k;

    # CRITICAL Rule 4: Never redirect /api/v1/* routes (clients set followRedirects = false)
    location /api/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Car long-polls hold up to 15s (car socket timeout = 20s)
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_buffering off;
    }
}
