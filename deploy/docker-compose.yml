services:
  digital-connect-plus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: digital-connect-plus
    restart: unless-stopped
    ports:
      - "${PORT:-8443}:8443"
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
      - AUTH_MODE=${AUTH_MODE:-device_pop_only}
      - SERVER_SHARED_TOKEN=${SERVER_SHARED_TOKEN:-}
      - TLS_MODE=${TLS_MODE:-ReverseProxyHttp}
      - DCP_DATA_DIR=/data
    volumes:
      - ./dcp-data:/data
